databases:
  - name: painpoint-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: painpoint
    user: painpoint_user

services:
  - type: web
    name: painpoint-ai-backend
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/Adoni4788/painpoint-ai.git
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: painpoint-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: https://gaplens.io,https://www.gaplens.io,https://painpoint-ai-frontend.onrender.com
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT
        value: "5/minute"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: ENVIRONMENT
        value: production
      - key: CLERK_ISSUER_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LOOPS_API_KEY
        sync: false
      - key: LOOPS_DIGEST_TEMPLATE_ID
        sync: false
      - key: DIGEST_SECRET
        sync: false
    buildFilter:
      paths:
        - backend/**

  - type: cron
    name: painpoint-digest-cron
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/Adoni4788/painpoint-ai.git
    branch: main
    rootDir: backend
    buildCommand: pip install requests
    schedule: "0 13 * * 5"
    command: >-
      python -c "
      import requests, os;
      r = requests.post(
        'https://painpoint-ai-backend.onrender.com/api/digest/send',
        headers={'X-Digest-Secret': os.environ['DIGEST_SECRET']},
        timeout=1800
      );
      print(r.status_code, r.text)
      "
    envVars:
      - key: DIGEST_SECRET
        sync: false

  - type: web
    name: painpoint-ai-frontend
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/Adoni4788/painpoint-ai.git
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://painpoint-ai-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
    buildFilter:
      paths:
        - frontend/**
