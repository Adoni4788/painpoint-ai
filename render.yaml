databases:
  - name: painpoint-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: painpoint
    user: painpoint_user

services:
  - type: web
    name: painpoint-ai-backend
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/Adoni4788/painpoint-ai.git
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: painpoint-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        value: https://gaplens.io,https://www.gaplens.io,https://painpoint-ai-frontend.onrender.com
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT
        value: "5/minute"
      - key: PYTHON_VERSION
        value: "3.11.0"
    buildFilter:
      paths:
        - backend/**

  - type: web
    name: painpoint-ai-frontend
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/Adoni4788/painpoint-ai.git
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://painpoint-ai-backend.onrender.com
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - frontend/**
